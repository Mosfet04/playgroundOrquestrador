name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Versão do pnpm vem de "packageManager" no package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # P2-02: tipos de src/server/orchestrator/openapi.d.ts em dia com o
      # snapshot docs/contracts/orchestrator-openapi.json.
      - run: pnpm contract:check
      - run: pnpm test

      # P2-06: sem Mongo; o build não precisa de env (o do servidor é lido
      # nas requisições).
      - run: pnpm build

  e2e:
    name: test:e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Versão do Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache do browser do Playwright
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Instalar Chromium e dependências do sistema
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # Com o browser em cache, faltam só os pacotes do sistema (não cacheados).
      - name: Instalar dependências do sistema do Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Com CI=true (padrão do Actions), o Playwright builda e serve o app com
      # next build + next start (playwright.config.ts, decisão 0013). O env
      # do servidor (login, chaves) é o de teste, de e2e/test-env.ts, passado
      # pelo playwright.config.ts.
      - run: pnpm test:e2e

      # P2-01: nenhum valor do env de teste no bundle do browser (os segredos
      # de e2e/test-env.ts têm a marca `e2e-segredo`; o hash começa com `scrypt:`).
      - name: Nenhum segredo no bundle do browser
        run: |
          # Sem o build, o grep sairia com 2 e o passo passaria.
          test -d .next/static || { echo '::error::.next/static não existe'; exit 1; }
          if grep -rqE 'e2e-segredo|scrypt:' .next/static; then
            echo '::error::valor do env do servidor em .next/static'
            exit 1
          fi
