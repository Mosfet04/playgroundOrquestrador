<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Playground com orquestrador fora · celular claro</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/playground/components/bundle.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="p105.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2b57d9}a:hover{color:#1f44b3}
</style>
</helmet>
<div class="pg-app phone">
  <header class="m-hdr">
    <button class="pg-btn pg-btn-ghost tap" type="button" aria-label="Abrir menu" aria-expanded="false"><svg class="pg-ico" viewBox="0 0 24 24" aria-hidden="true"><line x1="4" x2="20" y1="12" y2="12"></line><line x1="4" x2="20" y1="6" y2="6"></line><line x1="4" x2="20" y1="18" y2="18"></line></svg></button>
    <p style="margin: 0; flex: 1; font-size: 16px; line-height: 24px; font-weight: 600">Playground<span class="pg-mono" style="display: block; font-size: 12px; line-height: 16px; font-weight: 400; color: var(--muted-foreground)">testar</span></p>
    <button class="pg-btn pg-btn-ghost tap" type="button" aria-label="Abrir sessões e agente" aria-expanded="false"><svg class="pg-ico" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M9 3v18"></path></svg></button>
  </header>
  <h1 class="sr">Playground</h1>
  <div style="flex: 1; display: flex; align-items: center; padding: 16px">
    <div class="state" role="alert" style="padding: 24px 16px; gap: 12px; width: 100%">
      <span class="err-ico" aria-hidden="true"><svg class="pg-ico" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="m19 5 3-3"></path><path d="m2 22 3-3"></path><path d="M6.3 20.3a2.4 2.4 0 0 0 3.4 0L12 18l-6-6-2.3 2.3a2.4 2.4 0 0 0 0 3.4Z"></path><path d="M7.5 13.5 10 11"></path><path d="M10.5 16.5 13 14"></path><path d="m12 6 6 6 2.3-2.3a2.4 2.4 0 0 0 0-3.4l-2.6-2.6a2.4 2.4 0 0 0-3.4 0Z"></path></svg></span>
      <h2>Não foi possível conectar ao orquestrador</h2>
      <span class="pg-mono" style="font-size: 14px; word-break: break-all">http://localhost:7777</span>
      <p>O orquestrador não respondeu. Confira se ele está no ar e tente de novo.</p>
      <span class="pg-chip" style="color: var(--destructive)"><span class="pg-dot" aria-hidden="true"></span>offline</span>
      <button class="pg-btn pg-btn-outline" type="button" style="width: 100%; height: 40px"><svg class="pg-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg>Tentar de novo</button>
    </div>
  </div>
  <div style="padding: 0 16px 16px">
    <div class="composer-box is-off" style="flex-direction: row; align-items: flex-end">
      <label class="sr" for="msg-m">Mensagem</label>
      <textarea id="msg-m" rows="1" placeholder="Conecte o orquestrador para conversar" disabled style="flex: 1; min-height: 40px"></textarea>
      <button class="pg-btn" type="button" disabled style="height: 40px">Enviar</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
