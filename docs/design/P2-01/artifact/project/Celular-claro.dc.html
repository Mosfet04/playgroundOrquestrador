<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Login com credenciais inválidas · celular claro</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/playground/components/bundle.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="p201.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2b57d9}a:hover{color:#1f44b3}
</style>
</helmet>
<div class="pg-app phone">
  <div class="lg">
    <div class="lg-top">
      <button class="pg-btn pg-btn-ghost tap" type="button" aria-label="Idioma: Português. Alterar idioma"><span class="pg-mono" style="font-size: 12px">PT</span></button>
      <button class="pg-btn pg-btn-ghost tap" type="button" aria-label="Tema: Claro. Alterar tema"><svg class="pg-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.9 4.9 1.4 1.4"></path><path d="m17.7 17.7 1.4 1.4"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.3 17.7-1.4 1.4"></path><path d="m19.1 4.9-1.4 1.4"></path></svg></button>
    </div>
    <main class="lg-body" id="conteudo">
      <div class="lg-col">
        <div style="display: flex; align-items: center; gap: 12px">
          <span class="pg-mark pg-grad" aria-hidden="true"><svg class="pg-ico" viewBox="0 0 16 16" style="stroke-width: 1.25"><path d="M4 4.5 12 8M4 11.5 12 8M4 4.5v7"></path><circle cx="4" cy="4.5" r="2" fill="currentColor"></circle><circle cx="4" cy="11.5" r="2" fill="currentColor"></circle><circle cx="12" cy="8" r="2" fill="currentColor"></circle></svg></span>
          <div class="brand"><b>Orquestrador</b><span>playground</span></div>
        </div>
        <section class="pg-card lg-card" aria-labelledby="t-m">
          <div class="lg-head">
            <h1 id="t-m">Entrar</h1>
            <p>Use a credencial configurada no servidor do playground.</p>
          </div>
          <form class="lg-form" novalidate>
            <div class="notice notice-err" role="alert">
              <svg class="pg-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>
              <div class="notice-txt"><b>Usuário ou senha incorretos.</b><span>Confira os dois campos e tente de novo.</span></div>
            </div>
            <div class="pg-field">
              <label class="pg-label" for="mu">Usuário</label>
              <input class="pg-input" id="mu" autocomplete="username" autocapitalize="none" spellcheck="false" value="admin">
            </div>
            <div class="pg-field">
              <label class="pg-label" for="mp">Senha</label>
              <input class="pg-input is-focus" id="mp" type="password" autocomplete="current-password" value="">
            </div>
            <button class="pg-btn lg-submit" type="submit">Entrar</button>
          </form>
        </section>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
